services:
  portfolio:
    build: .
    image: hicham-portfolio:${RELEASE:-local}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PREVIEW_PORT:-28081}:8080"
    networks:
      proxy:
        aliases:
          - portfolio-hicham
          - cv-website
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
networks:
  proxy:
    name: ${PROXY_NETWORK:-nginx_network}
    external: true
